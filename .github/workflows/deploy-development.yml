name: SIPARTA Development Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siparta-development
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/tests.yml

  package:
    name: Package Development Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, pdo_pgsql, xml, curl, zip, gd
          tools: composer:v2
          coverage: none

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress --no-scripts

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Package release
        run: bash scripts/package-release.sh "$RUNNER_TEMP/siparta-release.tar.gz"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: siparta-development-release
          path: ${{ runner.temp }}/siparta-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Development
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    env:
      SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
      SSH_USER: ${{ secrets.DEV_SSH_USER }}
      APP_DIR: ${{ secrets.DEV_APP_DIR }}
      RELEASE_ID: dev-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: siparta-development-release

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
        run: bash scripts/configure-ssh.sh

      - name: Upload release
        run: |
          scp -o BatchMode=yes -o ConnectTimeout=15 -P "${SSH_PORT:-22}" \
            siparta-release.tar.gz \
            "${SSH_USER}@${SSH_HOST}:/tmp/siparta-${RELEASE_ID}.tar.gz"

      - name: Activate development release
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -p "${SSH_PORT:-22}" \
            "${SSH_USER}@${SSH_HOST}" \
            "APP_DIR='$APP_DIR' ARCHIVE='/tmp/siparta-${RELEASE_ID}.tar.gz' RELEASE_ID='$RELEASE_ID' bash -s" \
            < scripts/deploy-release.sh

      - name: Remove local SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
